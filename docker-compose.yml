# Base = produção (é o que roda no dbserver).
# Em dev local o docker-compose.override.yml é aplicado automaticamente.
services:
  web:
    build: .
    container_name: pdv_web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PDV_PORT:-5050}:5000"   # só localhost; acesso externo via Caddy
    environment:
      SECRET_KEY: ${SECRET_KEY:-dev-inseguro-troque-em-producao}
      DATABASE_URL: mysql+mysqlconnector://${DB_USER:-pdv}:${DB_PASSWORD:-pdvpass}@db/pdv_db
      TZ: America/Sao_Paulo
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11.4
    container_name: pdv_db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-pdvroot}
      MARIADB_DATABASE: pdv_db
      MARIADB_USER: ${DB_USER:-pdv}
      MARIADB_PASSWORD: ${DB_PASSWORD:-pdvpass}
      TZ: America/Sao_Paulo
    command: --innodb-buffer-pool-size=128M --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - pdv_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pdv_db_data:
