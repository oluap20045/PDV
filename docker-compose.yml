# Base = produção (é o que roda no dbserver).
# O banco é o MariaDB que já existe no servidor (capivara_mysql, 127.0.0.1:3337),
# por isso o app roda em network_mode host. DATABASE_URL vem do .env do servidor.
# Em dev local o docker-compose.override.yml é aplicado automaticamente e sobe um MariaDB próprio.
services:
  web:
    build: .
    container_name: pdv_web
    restart: unless-stopped
    network_mode: host
    command: ["gunicorn", "--bind", "127.0.0.1:${PDV_PORT:-5050}", "--workers", "2", "--timeout", "60", "run:app"]
    environment:
      SECRET_KEY: ${SECRET_KEY:?defina SECRET_KEY no .env}
      DATABASE_URL: ${DATABASE_URL:?defina DATABASE_URL no .env}
      TZ: America/Sao_Paulo
