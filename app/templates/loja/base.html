<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#3b2314">
    <meta name="robots" content="noindex">
    <title>{% block titulo %}{{ empresa.nome }}{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&family=Inter:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/loja.css') }}">
</head>
<body data-rastro-url="{{ url_for('loja.evento') }}" data-pagina="{% block pagina %}loja{% endblock %}">
    <header class="topo">
        <a class="marca" href="{{ url_for('loja.index') }}"><span class="marca-icone" aria-hidden="true">🍫</span> {{ empresa.nome }}</a>
        {% block topo_extra %}{% endblock %}
    </header>
    <main class="conteudo">
        {% block content %}{% endblock %}
    </main>
    <footer class="rodape">
        <strong>{{ empresa.nome }}</strong>
        <span>Pronta entrega · pagamento na entrega{% if empresa.mensagem %} · {{ empresa.mensagem }}{% endif %}</span>
    </footer>
    <script src="{{ url_for('static', filename='js/rastreio.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
